<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Island: C2 Question Deck</title>
    <style>
        :root {
            --primary: #4F46E5;
            --secondary: #10B981;
            --danger: #EF4444;
            --bg: #F3F4F6;
            --text: #1F2937;
            --explanation-bg: #FFFBEB;
            --explanation-border: #F59E0B;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { color: var(--primary); text-align: center; margin-bottom: 5px;}
        p.subtitle { text-align: center; color: #6B7280; margin-bottom: 30px;}

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 100%;
        }

        .num-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 20px 0;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .num-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background-color: #4338CA;
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }

        .num-btn:disabled {
            background-color: #D1D5DB;
            color: #9CA3AF;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px rgba(0,0,0,0.2);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .question-display {
            font-size: 1.4rem;
            margin-bottom: 20px;
            line-height: 1.6;
            font-weight: 500;
        }

        .answer-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--secondary);
            margin-bottom: 15px;
            display: none;
            min-height: 40px;
        }

        .explanation-box {
            display: none;
            background-color: var(--explanation-bg);
            border-left: 5px solid var(--explanation-border);
            padding: 15px;
            text-align: left;
            border-radius: 4px;
            margin-bottom: 25px;
            font-size: 1.05rem;
            color: #4B5563;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .action-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }

        .action-btn:hover { background-color: #059669; }

        .close-btn {
            background-color: #6B7280;
        }
        .close-btn:hover { background-color: #4B5563; }

    </style>
</head>
<body>

    <h1>Conditionals</h1>
    <p class="subtitle">Pick a number, complete the sentence, and check the rule.</p>

    <div class="grid-container" id="number-grid">
        <!-- Numbers will be generated by JavaScript here -->
    </div>

    <!-- The Pop-up Modal -->
    <div class="modal-overlay" id="question-modal">
        <div class="modal-content">
            <div class="question-display" id="modal-question">Loading...</div>
            <div class="answer-display" id="modal-answer">Answer here</div>

            <!-- Explanation Box -->
            <div class="explanation-box" id="modal-explanation"></div>

            <button class="action-btn" id="reveal-btn" onclick="revealAnswer()">Reveal Answer</button>
            <button class="action-btn close-btn" id="close-btn" onclick="closeModal()" style="display:none;">Close & Return to Board</button>
        </div>
    </div>

    <script>
        // 25 questions mixed randomly across Zero, First, Second, and Third conditionals.
        const questions = [
            // 1 - FIRST
            {
                q: "If we ___ now, we will catch the early train. (leave)",
                a: "leave",
                e: "First conditional: a possible future situation and its likely consequence. Form: If + present simple, will + infinitive."
            },
            // 2 - THIRD
            {
                q: "If the weather ___ so bad, we would have gone to the beach. (not / be)",
                a: "hadn't been",
                e: "Third conditional: an impossible past situation and its consequence. Form: If + past perfect, would have + past participle."
            },
            // 3 - ZERO
            {
                q: "If you ___ ice, it melts. (heat)",
                a: "heat",
                e: "Zero conditional: used for general truths or scientific facts. Form: If + present simple, present simple."
            },
            // 4 - SECOND
            {
                q: "If I ___ you, I wouldn't accept that job offer. (be)",
                a: "were",
                e: "Second conditional: an imaginary present situation. Use 'were' (not 'was') in the if-clause for all subjects, especially in formal English."
            },
            // 5 - THIRD
            {
                q: "If I ___ about the traffic, I would have arrived on time. (know)",
                a: "had known",
                e: "Third conditional: past perfect in the if-clause, 'would have + past participle' in the main clause."
            },
            // 6 - FIRST
            {
                q: "If she ___ the exam, she will celebrate. (pass)",
                a: "passes",
                e: "First conditional: present simple in the if-clause, 'will + infinitive' in the main clause."
            },
            // 7 - SECOND
            {
                q: "If I ___ more money, I would buy a house. (have)",
                a: "had",
                e: "Second conditional: past simple in the if-clause to describe an imaginary present. Main clause: 'would + infinitive'."
            },
            // 8 - ZERO
            {
                q: "When the sun ___, the temperature rises. (set)",
                a: "sets",
                e: "Zero conditional: 'when' can replace 'if' to show that a situation happens frequently or is a general truth."
            },
            // 9 - THIRD
            {
                q: "If the speaker ___ droned on, it would have been more interesting. (not)",
                a: "hadn't",
                e: "Third conditional: negative past perfect in the if-clause. The main clause uses 'would have been'."
            },
            // 10 - FIRST
            {
                q: "If the negotiations fail, we ___ have to reconsider our strategy. (will)",
                a: "will",
                e: "First conditional: a likely future consequence. The main clause uses 'will + infinitive'."
            },
            // 11 - SECOND
            {
                q: "If she ___ harder, she would pass the exam. (study)",
                a: "studied",
                e: "Second conditional: an unlikely or hypothetical future situation. Past simple in the if-clause."
            },
            // 12 - ZERO
            {
                q: "If you ___ enough water, your body functions properly. (drink)",
                a: "drink",
                e: "Zero conditional: describes a generally true situation. Present simple in the if-clause."
            },
            // 13 - THIRD
            {
                q: "If they ___ in advance, they could have got a table at the restaurant. (book)",
                a: "had booked",
                e: "Third conditional: the main clause can use 'could have' instead of 'would have' to express ability/possibility."
            },
            // 14 - FIRST
            {
                q: "If you ___ your passport, you won't be able to board the flight. (lose)",
                a: "lose",
                e: "First conditional: present simple in the if-clause, negative 'will' in the main clause."
            },
            // 15 - SECOND
            {
                q: "If we ___ a car, we would drive to the coast every weekend. (have)",
                a: "had",
                e: "Second conditional: an imaginary present situation and its hypothetical consequence."
            },
            // 16 - ZERO
            {
                q: "Plants die if they ___ enough sunlight. (not / get)",
                a: "don't get",
                e: "Zero conditional: a general truth. Note the negative present simple form in the if-clause."
            },
            // 17 - THIRD
            {
                q: "If she ___ the instructions carefully, she wouldn't have made so many errors. (read)",
                a: "had read",
                e: "Third conditional: past perfect in the if-clause, 'wouldn't have + past participle' in the main clause."
            },
            // 18 - FIRST
            {
                q: "If it ___ tomorrow, we might cancel the picnic. (rain)",
                a: "rains",
                e: "First conditional: the main clause can use 'might' (or 'may', 'could') instead of 'will' to show possibility rather than certainty."
            },
            // 19 - SECOND
            {
                q: "If I ___ speak Japanese, I would apply for that job in Tokyo. (can)",
                a: "could",
                e: "Second conditional: 'could' in the if-clause expresses an imaginary present ability."
            },
            // 20 - ZERO
            {
                q: "If you mix red and blue, you ___ purple. (get)",
                a: "get",
                e: "Zero conditional: a scientific/general fact. Present simple in the main clause."
            },
            // 21 - THIRD
            {
                q: "If I ___ known about the meeting, I would have attended. (have)",
                a: "had",
                e: "Third conditional: past perfect in the if-clause. Here the auxiliary 'had' is the missing word before 'known'."
            },
            // 22 - FIRST
            {
                q: "If the company ___ the contract, they will expand their operations. (win)",
                a: "wins",
                e: "First conditional: a possible future event and its likely result. Present simple in the if-clause."
            },
            // 23 - SECOND
            {
                q: "If he ___ more confident, he would speak up in meetings. (be)",
                a: "were",
                e: "Second conditional: an imaginary present state. Use 'were' for all subjects in formal English."
            },
            // 24 - ZERO
            {
                q: "If employees ___ late repeatedly, they are usually dismissed. (arrive)",
                a: "arrive",
                e: "Zero conditional: a general rule or habitual consequence in the workplace. Present simple in both clauses."
            },
            // 25 - SECOND
            {
                q: "If we ___ the lottery, we would travel the world. (win)",
                a: "won",
                e: "Second conditional: an unlikely future situation. Past simple in the if-clause."
            }
        ];

        let currentQuestionIndex = -1;

        // Initialize the grid on page load
        window.onload = () => {
            const grid = document.getElementById('number-grid');
            for (let i = 0; i < questions.length; i++) {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.innerText = i + 1;
                btn.id = `btn-${i}`;
                btn.onclick = () => openQuestion(i);
                grid.appendChild(btn);
            }
        };

        function openQuestion(index) {
            currentQuestionIndex = index;
            const qData = questions[index];

            // Set text content
            document.getElementById('modal-question').innerText = qData.q;

            // Handle cases where there might be alternative answers separated by "/"
            let answerText = qData.a;
            if (answerText.includes('/')) {
                document.getElementById('modal-answer').innerHTML = answerText.split('/').map(a => `<span style="color:#10B981">${a}</span>`).join(' / ');
            } else {
                document.getElementById('modal-answer').innerText = answerText;
            }

            // Set Explanation Text
            document.getElementById('modal-explanation').innerText = qData.e;

            // Reset modal state
            document.getElementById('modal-answer').style.display = 'none';
            document.getElementById('modal-explanation').style.display = 'none';
            document.getElementById('reveal-btn').style.display = 'block';
            document.getElementById('close-btn').style.display = 'none';

            // Show modal
            document.getElementById('question-modal').style.display = 'flex';
        }

        function revealAnswer() {
            document.getElementById('modal-answer').style.display = 'block';
            document.getElementById('modal-explanation').style.display = 'block';
            document.getElementById('reveal-btn').style.display = 'none';
            document.getElementById('close-btn').style.display = 'block';
        }

        function closeModal() {
            // Hide modal
            document.getElementById('question-modal').style.display = 'none';

            // Disable the button on the grid and change its style
            const btn = document.getElementById(`btn-${currentQuestionIndex}`);
            btn.disabled = true;
            btn.innerText = "✓";
        }
    </script>
</body>
</html>
